[project]
name = "recon"
version = "0.0.0"
description = "Local-first TryHackMe study companion: capture panel, Obsidian vault, flashcards."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5",
    "ollama>=0.6.3",
    "pillow>=13",
    "pydantic>=2.14",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.8",
    "mutmut>=3.8,<4",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "PL", "PT", "G", "LOG", "T20",
    "RET", "ARG", "PTH", "TRY", "RUF", "ANN", "D",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# S101: pytest's assert is the test mechanism.
# PLR2004: literal expected values are the point of a test.
# D1: test functions are named for what they check; docstrings would repeat the name.
"tests/**" = ["S101", "PLR2004", "D1"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
files = ["recon", "scripts"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# --------------------------------------------------------------------------
# pytest and coverage
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "ollama: needs a running local Ollama with the configured models",
    "gpu: needs the NVIDIA GPU (CUDA)",
    "slow: takes more than a few seconds; skipped by the pre-commit hook",
]

[tool.coverage.run]
branch = true
source = ["recon"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# --------------------------------------------------------------------------
# mutmut (3.x): safety-critical modules only. Paths that don't exist yet are
# picked up automatically as the modules land (flags filter: Phase 1;
# stage and sanitise: Phase 2; factcheck: Phase 3).
# --------------------------------------------------------------------------
[tool.mutmut]
source_paths = ["recon/"]
only_mutate = [
    "recon/engine/flags_filter.py",
    "recon/engine/stage.py",
    "recon/engine/sanitise.py",
    "recon/engine/factcheck/*",
]
pytest_add_cli_args = ["-m", "not ollama and not gpu"]
