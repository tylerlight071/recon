[project]
name = "recon"
version = "0.0.0"
description = "Local-first TryHackMe study companion: capture panel, Obsidian vault, flashcards."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jeepney>=0.9",
    "numpy>=2.5",
    "ollama>=0.6.3",
    "pillow>=13",
    "pydantic>=2.14",
    "pyside6>=6.11.2,<6.12",
]

[project.optional-dependencies]
voice = [
    # faster-whisper 1.2.1 passes `metadata_errors` to av.open(), which PyAV 19
    # removed. Fixed upstream (SYSTRAN/faster-whisper#1589) but not released;
    # drop this cap once a faster-whisper release includes the fix.
    "av>=11,<19",
    "ctranslate2>=4.6.3",
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.8",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.8",
    "mutmut>=3.8,<4",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "PL", "PT", "G", "LOG", "T20",
    "RET", "ARG", "PTH", "TRY", "RUF", "ANN", "D",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# S101: pytest's assert is the test mechanism.
# PLR2004: literal expected values are the point of a test.
# D1: test functions are named for what they check; docstrings would repeat the name.
"tests/**" = ["S101", "PLR2004", "D1"]
# T201: scripts/ are command-line tools; printing is their output.
"scripts/**" = ["T201"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
files = ["recon", "scripts"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# faster-whisper and jeepney ship no type hints; CI also skips the `voice` extra.
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "jeepney", "jeepney.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest and coverage
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "ollama: needs a running local Ollama with the configured models",
    "gpu: needs the NVIDIA GPU (CUDA)",
    "slow: takes more than a few seconds; skipped by the pre-commit hook",
]

[tool.coverage.run]
branch = true
# Long-lived scripts are measured too (audit F-08); smoke scripts are one-off
# Phase 0 probes of hardware and the desktop, exercised by hand at the gate.
source = ["recon", "scripts"]
omit = ["scripts/smoke/*"]
# Report keys relative to the repo, so the per-package gates always match.
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# --------------------------------------------------------------------------
# mutmut (3.x): safety-critical modules only. Paths that don't exist yet are
# picked up automatically as the modules land (flags filter: Phase 1;
# stage and sanitise: Phase 2; factcheck: Phase 3).
# --------------------------------------------------------------------------
[tool.mutmut]
source_paths = ["recon/"]
only_mutate = [
    "recon/engine/flags_filter.py",
    "recon/engine/stage.py",
    "recon/engine/sanitise.py",
    "recon/engine/factcheck/*",
]
pytest_add_cli_args = ["-m", "not ollama and not gpu"]
